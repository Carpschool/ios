name: Carpschool
options:
  bundleIdPrefix: ca.carpschool
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: "2.0.0"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.0

targets:
  Carpschool:
    type: application
    platform: iOS
    sources:
      - path: Carpschool
        excludes: ["AppIcon.icon/**"]
      - path: Carpschool/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Carpschool/Info.plist
      properties:
        CFBundleDisplayName: Carpschool
        CentralURL: $(CENTRAL_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        NSLocationWhenInUseUsageDescription: "Carpschool reads your location once when a rider boards or is dropped off. It never tracks you."
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ca.carpschool.ios
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_ENTITLEMENTS: Carpschool/Carpschool.entitlements
    scheme:
      testTargets: [CarpschoolUITests]
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - package: SocketIO
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI

  CarpschoolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CarpschoolUITests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ca.carpschool.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Carpschool
    dependencies:
      - target: Carpschool
